<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Listen Here">
<meta name="theme-color" content="#F1ECE2">
<title>Listen Here</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- SCAN: opens straight into the camera -->
<section id="scan" class="view active" aria-label="Scan">
  <video id="video" playsinline muted autoplay></video>
  <img id="freeze" class="freeze" alt="" hidden>
  <header class="topbar">
    <img src="/favicon-32.png" alt="">
    <span class="wordmark">LISTEN HERE</span>
  </header>
  <div class="frame" id="frame" aria-hidden="true">
    <i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>
    <div class="ring"></div>
  </div>
  <button id="startCam" class="startcam" hidden>Tap to start camera</button>
  <p class="hint mono" id="hint">Fill the frame with a cover or label</p>
</section>

<!-- COLLECTION: the crate -->
<section id="collection" class="view" aria-label="Collection">
  <header class="colhead">
    <h1>Collection</h1>
    <div class="right mono">
      <button id="clearSamples" class="mono linkbtn" hidden>Remove samples</button>
      <span id="count"></span>
    </div>
  </header>
  <div class="crate" id="crate"></div>
  <div class="crate-info" id="crateInfo"></div>
  <div class="empty" id="empty" hidden>
    <p>Nothing in the crate yet</p>
    <div class="mono" style="color:var(--quiet)">Every record you scan lands here</div>
    <button class="btn" id="addSamples">Fill with sample records</button>
  </div>
</section>

<!-- ALBUM: slides up over the camera -->
<aside id="sheet" class="sheet" aria-label="Album" aria-hidden="true"></aside>

<!-- NAVIGATION -->
<nav class="tabbar">
  <button class="tab active" data-view="scan">Scan</button>
  <button id="shutter" class="shutter" aria-label="Photograph cover or label"></button>
  <button class="tab" data-view="collection">Collection</button>
</nav>

<script type="module" src="/app.js"></script>
</body>
</html>
