<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Listen Here">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F1ECE2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14120F" media="(prefers-color-scheme: dark)">
<title>Listen Here</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body data-view="scan">

<!-- SCAN: opens straight into the camera -->
<section id="scan" class="view active" aria-label="Scan">
  <video id="video" playsinline muted autoplay></video>
  <img id="freeze" class="freeze" alt="" hidden>
  <header class="topbar">
    <img src="/favicon-32.png" alt="">
    <span class="wordmark">LISTEN HERE</span>
    <button class="toCollection" data-go="collection">Collection</button>
  </header>
  <div class="frame" id="frame" aria-hidden="true">
    <i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>
    <div class="ring"></div>
  </div>
  <button id="startCam" class="startcam" hidden>Tap to start camera</button>
  <p class="hint mono" id="hint">Fill the frame with a cover or label</p>
</section>

<!-- COLLECTION: crate or list -->
<section id="collection" class="view" aria-label="Collection">
  <header class="colhead">
    <div class="row1">
      <h1>Collection</h1>
      <div class="seg" role="group" aria-label="Collection view">
        <button data-mode="crate">Crate</button>
        <button data-mode="list">List</button>
      </div>
    </div>
    <div class="row2 mono">
      <span id="count"></span>
      <button id="clearSamples" class="linkbtn mono" hidden>Remove samples</button>
    </div>
  </header>

  <div id="crateWrap">
    <div class="crate" id="crate"></div>
    <div class="crate-info" id="crateInfo"></div>
  </div>

  <div id="listWrap" hidden>
    <div class="searchbar"><input id="q" type="search" placeholder="Search your collection" autocomplete="off" autocorrect="off" enterkeyhint="search"></div>
    <div class="sortbar mono" role="group" aria-label="Sort by">
      <span class="quiet">Sort</span>
      <button data-sort="artist">Artist</button>
      <button data-sort="title">Title</button>
      <button data-sort="date">Date</button>
    </div>
    <div class="listArea">
      <ul class="list" id="list"></ul>
      <nav class="azindex" id="az" aria-label="Jump to letter"></nav>
      <div class="azbubble" id="azBubble" hidden></div>
      <p class="noresults mono" id="noResults" hidden>No records match</p>
    </div>
  </div>

  <div class="empty" id="empty" hidden>
    <p>Nothing in the crate yet</p>
    <div class="mono quiet">Every record you scan lands here</div>
    <button class="btn" id="addSamples">Fill with sample records</button>
  </div>
</section>

<!-- ALBUM: full screen -->
<aside id="sheet" class="sheet" aria-label="Album" aria-hidden="true"></aside>

<!-- SHUTTER: floats at the bottom. On the camera it scans; anywhere else it brings you back to the camera -->
<button id="shutter" class="shutter" aria-label="Photograph cover or label"></button>

<script type="module" src="/app.js"></script>
</body>
</html>
